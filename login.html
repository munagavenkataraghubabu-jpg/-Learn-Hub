<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | LearnHub</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style & Responsive CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light">

    <!-- Sticky Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sticky-navbar">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                    <span class="rounded-3 bg-primary text-white d-flex align-items-center justify-content-center shadow-sm" style="width: 38px; height: 38px;">
                        <i class="bi bi-mortarboard-fill fs-5"></i>
                    </span>
                    <span class="fs-4 text-dark">Learn<span class="text-primary">Hub</span></span>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="signup.html" class="btn btn-outline-primary btn-sm fw-semibold">Sign Up</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    
                    <div class="p-4 p-md-5 bg-white rounded-4 border shadow-sm">
                        
                        <div class="text-center mb-4">
                            <span class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center p-3 mb-3">
                                <i class="bi bi-person-lock fs-2"></i>
                            </span>
                            <h1 class="h3 fw-bold text-dark">Welcome to LearnHub</h1>
                            <p class="text-secondary small">Login to access your courses and student dashboard.</p>
                        </div>

                        <!-- Demo Notice Alert -->
                        <div class="alert alert-info py-2 px-3 small border-0 mb-4">
                            <i class="bi bi-info-circle-fill me-1"></i><strong>Demo Credentials:</strong><br>
                            Email: <code>alex@learnhub.edu</code><br>
                            Password: <code>password123</code>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="you@domain.com" value="alex@learnhub.edu" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center">
                                    <label for="loginPassword" class="form-label fw-semibold small">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="••••••••" value="password123" required>
                                    <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePasswordBtn" aria-label="Toggle password visibility">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                                <label class="form-check-label small text-secondary" for="rememberMe">Remember me for 30 days</label>
                            </div>

                            <div id="loginAlertBox" class="d-none alert alert-danger small mb-3"></div>

                            <button type="submit" class="btn btn-theme-primary w-100 py-2 fw-semibold justify-content-center">
                                Login to Account &rarr;
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top small text-secondary">
                            Don't have an account? <a href="signup.html" class="fw-bold text-primary">Create Account</a>
                        </div>

                    </div>

                    <p class="text-center text-muted small mt-4">
                        <i class="bi bi-shield-lock me-1"></i>Frontend Demo Authentication using LocalStorage.
                    </p>

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/courses.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setupPasswordToggle("#loginPassword", "#togglePasswordBtn");

            const form = document.getElementById("loginForm");
            const alertBox = document.getElementById("loginAlertBox");

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const email = document.getElementById("loginEmail").value;
                const password = document.getElementById("loginPassword").value;
                const remember = document.getElementById("rememberMe").checked;

                const res = loginUser(email, password, remember);
                if (res.success) {
                    showToast("Login successful! Redirecting...", "success");
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get("redirect") || "dashboard.html";
                    setTimeout(() => {
                        window.location.href = redirect;
                    }, 800);
                } else {
                    alertBox.textContent = res.message;
                    alertBox.classList.remove("d-none");
                }
            });
        });
    </script>
</body>
</html>
