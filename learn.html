<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Desk | LearnHub</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style & Responsive CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light">

    <!-- Top Study Desk Navigation -->
    <header class="bg-white border-bottom py-2 sticky-top shadow-sm">
        <div class="container-fluid px-4">
            <div class="d-flex justify-content-between align-items-center">
                
                <div class="d-flex align-items-center gap-3">
                    <a href="dashboard.html" class="btn btn-outline-secondary btn-sm" title="Back to Dashboard">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                    <span class="vr d-none d-sm-block"></span>
                    <h1 class="h6 mb-0 fw-bold text-dark text-truncate" style="max-width: 320px;" id="learnCourseTitle">Loading Course...</h1>
                </div>

                <!-- Course Progress Bar in Navbar -->
                <div class="d-flex align-items-center gap-3" style="min-width: 200px;">
                    <div class="w-100 d-none d-md-block">
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>Progress</span>
                            <span id="learnProgressText" class="fw-bold text-primary">0%</span>
                        </div>
                        <div class="progress-bar-custom">
                            <div class="progress-fill" id="learnProgressFill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div id="navbarAuthActions"></div>
                </div>

            </div>
        </div>
    </header>

    <main class="container-fluid px-4 py-4">
        
        <!-- CSS Grid: Study Desk Layout (2 Columns: Main Lesson + Sidebar) -->
        <div class="row g-4">
            
            <!-- Left Main Content Column (8 Cols on Desktop) -->
            <div class="col-lg-8">
                
                <!-- Lesson Player / Visual Area -->
                <div class="card border rounded-4 shadow-sm overflow-hidden mb-4 bg-white">
                    <div class="bg-dark text-white p-4 d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary mb-1">Active Study Unit</span>
                            <h2 class="h5 fw-bold text-white mb-0" id="currentLessonTitle">Lesson Title</h2>
                        </div>
                        <span class="badge bg-secondary" id="currentLessonDuration">-- min</span>
                    </div>

                    <!-- Lesson Body Content -->
                    <div class="card-body p-4 p-md-5" id="lessonContentBody">
                        <!-- Populated dynamically by learning.js -->
                    </div>

                    <!-- Action Navigation Footer -->
                    <div class="card-footer bg-light p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <button class="btn btn-outline-secondary fw-semibold" id="prevLessonBtn" onclick="navigatePrevLesson()">
                            <i class="bi bi-chevron-left me-1"></i> Previous Lesson
                        </button>
                        
                        <button class="btn btn-success fw-semibold" id="markCompletedBtn" onclick="toggleCurrentLessonCompleted()">
                            <i class="bi bi-check-lg me-1"></i> Mark as Completed
                        </button>
                        
                        <button class="btn btn-primary fw-semibold" id="nextLessonBtn" onclick="navigateNextLesson()">
                            Next Lesson <i class="bi bi-chevron-right ms-1"></i>
                        </button>
                    </div>
                </div>

                <!-- Discussion & Resource Helper -->
                <div class="p-4 bg-white rounded-4 border shadow-sm">
                    <h3 class="h6 fw-bold text-dark mb-2"><i class="bi bi-info-circle text-primary me-2"></i>Study Tip</h3>
                    <p class="small text-secondary mb-0">
                        Practice each code snippet locally on your own computer or browser console. Completed lessons are automatically synchronized with your student dashboard.
                    </p>
                </div>

            </div>

            <!-- Right Sidebar Column: Lesson Curriculum Checklist (4 Cols) -->
            <div class="col-lg-4">
                <div class="card border rounded-4 shadow-sm overflow-hidden sticky-top" style="top: 80px;">
                    <div class="card-header bg-white p-3 border-bottom d-flex justify-content-between align-items-center">
                        <h4 class="h6 fw-bold mb-0 text-dark">Course Curriculum</h4>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Checklist</span>
                    </div>
                    <div class="card-body p-0" id="lessonSidebarList" style="max-height: 70vh; overflow-y: auto;">
                        <!-- Lesson items populated dynamically -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/courses.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/learning.js"></script>
</body>
</html>
