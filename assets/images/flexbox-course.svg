<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="flexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#flexBg)"/>
  <!-- Flex Container representation -->
  <rect x="50" y="45" width="300" height="110" rx="12" fill="#0f172a" opacity="0.4" stroke="#ffffff" stroke-dasharray="6,6" stroke-width="2"/>
  <!-- Flex items -->
  <rect x="75" y="65" width="60" height="70" rx="8" fill="#38bdf8"/>
  <text x="105" y="105" fill="#0f172a" font-size="14" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Item 1</text>
  
  <rect x="155" y="65" width="90" height="70" rx="8" fill="#ffffff"/>
  <text x="200" y="105" fill="#0f172a" font-size="14" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Grow: 2</text>
  
  <rect x="265" y="65" width="60" height="70" rx="8" fill="#38bdf8"/>
  <text x="295" y="105" fill="#0f172a" font-size="14" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Item 3</text>
  
  <text x="200" y="210" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CSS Flexbox 1D Alignment</text>
</svg>