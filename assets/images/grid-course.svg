<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#gridBg)"/>
  <!-- 2D Grid Cells -->
  <g transform="translate(70, 35)">
    <!-- Header Spans 3 cols -->
    <rect x="0" y="0" width="260" height="30" rx="6" fill="#38bdf8"/>
    <text x="130" y="20" fill="#0f172a" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">grid-area: header</text>
    
    <!-- Sidebar -->
    <rect x="0" y="38" width="75" height="85" rx="6" fill="#64748b"/>
    <text x="37" y="85" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">sidebar</text>
    
    <!-- Main Content -->
    <rect x="83" y="38" width="177" height="85" rx="6" fill="#475569"/>
    <text x="171" y="85" fill="#ffffff" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">main content</text>
  </g>
  <text x="200" y="210" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CSS Grid 2D Architecture</text>
</svg>