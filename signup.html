<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | LearnHub</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style & Responsive CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light">

    <!-- Sticky Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sticky-navbar">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                    <span class="rounded-3 bg-primary text-white d-flex align-items-center justify-content-center shadow-sm" style="width: 38px; height: 38px;">
                        <i class="bi bi-mortarboard-fill fs-5"></i>
                    </span>
                    <span class="fs-4 text-dark">Learn<span class="text-primary">Hub</span></span>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <a href="login.html" class="btn btn-outline-primary btn-sm fw-semibold">Login</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    
                    <div class="p-4 p-md-5 bg-white rounded-4 border shadow-sm">
                        
                        <div class="text-center mb-4">
                            <span class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center p-3 mb-3">
                                <i class="bi bi-person-plus fs-2"></i>
                            </span>
                            <h1 class="h3 fw-bold text-dark">Create Free Account</h1>
                            <p class="text-secondary small">Start learning web development today with LearnHub.</p>
                        </div>

                        <!-- Registration Form -->
                        <form id="signupForm" novalidate>
                            <div class="mb-3">
                                <label for="signupName" class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="signupName" placeholder="e.g. Alex Johnson" required>
                                <div class="invalid-feedback small">Please enter your full name.</div>
                            </div>

                            <div class="mb-3">
                                <label for="signupEmail" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="signupEmail" placeholder="you@domain.com" required>
                                <div class="invalid-feedback small">Please provide a valid email address.</div>
                            </div>

                            <div class="mb-3">
                                <label for="signupPassword" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="signupPassword" placeholder="Minimum 6 characters" required>
                                <div class="invalid-feedback small">Password must be at least 6 characters.</div>
                            </div>

                            <div class="mb-4">
                                <label for="signupConfirmPassword" class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Re-enter password" required>
                                <div class="invalid-feedback small">Passwords must match.</div>
                            </div>

                            <div id="signupAlertBox" class="d-none alert alert-danger small mb-3"></div>

                            <button type="submit" class="btn btn-theme-primary w-100 py-2 fw-semibold justify-content-center">
                                Create Account &rarr;
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top small text-secondary">
                            Already have an account? <a href="login.html" class="fw-bold text-primary">Login Here</a>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/courses.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("signupForm");
            const alertBox = document.getElementById("signupAlertBox");

            form.addEventListener("submit", (e) => {
                e.preventDefault();
                alertBox.classList.add("d-none");

                const name = document.getElementById("signupName").value.trim();
                const email = document.getElementById("signupEmail").value.trim();
                const password = document.getElementById("signupPassword").value;
                const confirmPassword = document.getElementById("signupConfirmPassword").value;

                if (!name || name.length < 2) {
                    alertBox.textContent = "Please enter your full name (at least 2 characters).";
                    alertBox.classList.remove("d-none");
                    return;
                }

                if (!email || !email.includes("@")) {
                    alertBox.textContent = "Please enter a valid email address.";
                    alertBox.classList.remove("d-none");
                    return;
                }

                if (!password || password.length < 6) {
                    alertBox.textContent = "Password must be at least 6 characters long.";
                    alertBox.classList.remove("d-none");
                    return;
                }

                if (password !== confirmPassword) {
                    alertBox.textContent = "Passwords do not match.";
                    alertBox.classList.remove("d-none");
                    return;
                }

                const res = registerUser(name, email, password);
                if (res.success) {
                    showToast("Account created successfully! Redirecting to login...", "success");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);
                } else {
                    alertBox.textContent = res.message;
                    alertBox.classList.remove("d-none");
                }
            });
        });
    </script>
</body>
</html>
